<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>trading.tf</title><style>:root{--bg:#f4f1ea;--card:#fff;--text:#1f1d1a;--muted:#6b665d;--line:#ddd6c8;--accent:#cf7336;--accent-t:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--card:#252320;--text:#eee9df;--muted:#a19a8c;--line:#3a3630;--accent:#e08a4c;--accent-t:#1a1917}}
:root[data-theme="dark"]{--bg:#1a1917;--card:#252320;--text:#eee9df;--muted:#a19a8c;--line:#3a3630;--accent:#e08a4c;--accent-t:#1a1917}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:560px;padding:24px 16px;text-align:center}
h1{font-size:1.6rem;margin:0 0 6px}p{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
a.card{display:block;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:28px 16px;color:var(--text);text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{font-size:2.2rem;display:block;margin-bottom:8px}.card b{font-size:1.1rem}.card small{display:block;color:var(--muted);margin-top:4px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-t);padding:10px 20px;border-radius:10px;text-decoration:none;font-weight:600}</style></head>
<body><main>
<h1>Trading.TF</h1><p>Pick where you want to go</p>
<div class="grid">
<a class="card" href="calculator/"><span class="ic">🛠️</span><b>Calculator</b><small>Killstreak Fabricator Cost Calculator</small></a>
<a class="card" href="trading/"><span class="ic">🔁</span><b>Trading</b><small>Coming soon</small></a>
</div></main></body></html>
